name: Foundation quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Block high-severity dependency findings
        run: python3 scripts/dependency_scan.py
      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-groups
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test TypeScript and bootstrap contracts
        run: pnpm test
      - name: Test Python validators and negative fixtures
        run: uv run pytest
      - name: Run architecture, contract and security validators
        run: uv run python scripts/validate_all.py

  validate-local-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify local pgvector migrations
        env:
          AXTRO_LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          AXTRO_ALLOW_LOCAL_DATABASE_URL: "1"
        run: pnpm db:test
      - name: Prove tenant RLS isolation and relational boundaries
        env:
          AXTRO_LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          AXTRO_ALLOW_LOCAL_DATABASE_URL: "1"
        run: pnpm db:rls
