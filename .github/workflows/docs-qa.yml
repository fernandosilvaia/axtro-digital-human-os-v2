name: Foundation quality gates

on:
  pull_request:
  push:
    # Só main: PR já cobre branches de PR — sem o filtro, cada commit numa
    # branch de PR rodava o workflow em DOBRO (push + pull_request), e os dois
    # runs de e2e mutavam o MESMO tenant demo em paralelo (auditoria 2026-08-02).
    branches: [main]
  workflow_dispatch:

# Um run por ref: o e2e loga na mesma conta demo e muta as mesmas entidades
# seed — dois runs simultâneos correm um contra o outro com retries: 0.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Block high-severity dependency findings
        run: python3 scripts/dependency_scan.py
      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-groups
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test TypeScript and bootstrap contracts
        run: pnpm test
      - name: Test Python validators and negative fixtures
        run: uv run pytest
      - name: Run architecture, contract and security validators
        run: uv run python scripts/validate_all.py

  build-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages (@axtro/domain, provider adapters, ...)
        run: pnpm typecheck
      - name: Typecheck portal
        run: pnpm --filter @axtro/portal run typecheck
      - name: Build portal (Next.js)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: pnpm --filter @axtro/portal run build

  check-e2e-secrets:
    # jobs.<job_id>.if só aceita os contextos github/needs/vars/inputs — não
    # secrets (achado real 2026-08-01: um `if: ${{ secrets... }}` direto no
    # job invalida o workflow INTEIRO, os 4 jobs somem e todo run vira
    # "workflow file issue" com 0 jobs, silenciosamente, sem nenhum erro
    # visível em lint local nem no docs_qa.py). Contorno padrão: checar o
    # segredo dentro de um step (secrets É permitido em `run:`) e expor via
    # output, que aí sim pode ser lido em jobs.<job_id>.if via `needs`.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        run: echo "has-secrets=${{ secrets.DEMO_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

  e2e-portal:
    # Roda só quando os segredos de conta demo existem no repositório
    # (Settings → Secrets and variables → Actions). Sem eles o job é pulado
    # inteiro (nunca falha por ausência de credencial) — mesmo padrão do
    # resto do projeto: implementar + documentar em NEEDS_CONNECTION.md,
    # deixando a credencial real como gate humano. PRs de fork também não
    # têm acesso aos secrets, então o skip aqui é automático e seguro.
    needs: check-e2e-secrets
    runs-on: ubuntu-latest
    # 20min: o webServer do Playwright agora faz `next build && next start`
    # no CI (valida o build de produção antes do deploy) — o build soma
    # ~2min ao job.
    timeout-minutes: 20
    if: ${{ needs.check-e2e-secrets.outputs.has-secrets == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages (@axtro/domain, provider adapters, ...)
        run: pnpm typecheck
      - name: Install Playwright Chromium
        run: pnpm --filter @axtro/portal exec playwright install --with-deps chromium
      - name: Write credenciais demo para o e2e (nunca commitadas, só no runner efêmero)
        working-directory: apps/portal
        run: |
          # Delimitador QUOTADO: o runner substitui as expressões de secrets
          # ANTES de o bash rodar; sem o quote o bash faria uma SEGUNDA
          # expansão e corromperia senha/chave contendo cifrão, crase ou
          # backslash (auditoria 2026-08-02).
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}
          EOF
      - name: E2E — ciclos completos de agente/fonte/convite, SEO e middleware (fake providers)
        working-directory: apps/portal
        run: pnpm run e2e
      - name: Upload relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/portal/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  validate-local-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify local pgvector migrations
        env:
          AXTRO_LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          AXTRO_ALLOW_LOCAL_DATABASE_URL: "1"
        run: pnpm db:test
      - name: Prove tenant RLS isolation and relational boundaries
        env:
          AXTRO_LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          AXTRO_ALLOW_LOCAL_DATABASE_URL: "1"
        run: pnpm db:rls
