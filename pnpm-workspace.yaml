packages:
  - apps/api
  - apps/event-relay
  - apps/ingestion-worker
  - apps/meeting-room
  - apps/portal
  - apps/web
  - apps/workflow-worker
  - packages/*
  - packages/role-packs/*
  - packages/tool-adapters/*

allowBuilds:
  sharp: true

autoInstallPeers: false
# minimumReleaseAge nunca tinha sido definido no arquivo commitado — a lista
# de exclusão abaixo já existia (gerada quando o autor tinha essa política
# ativa via config local não commitada), mas sem o minimumReleaseAge em si a
# exclusão era um no-op em qualquer clone novo/CI/build da Railway: delay
# zero pra QUALQUER pacote, e nenhuma defesa proativa contra publish
# malicioso/conta comprometida recém-publicada (achado onda 7, D-V2-116).
# 1440min = 24h: suficiente pra pegar pacotes yanked rapidamente sem atrasar
# o desenvolvimento normal.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.110.6'
  - '@supabase/functions-js@2.110.6'
  - '@supabase/postgrest-js@2.110.6'
  - '@supabase/realtime-js@2.110.6'
  - '@supabase/storage-js@2.110.6'
  - '@supabase/supabase-js@2.110.6'
# CVE HIGH real corrigida na onda 7 (D-V2-116, GHSA-2v37-7h3g-55p8):
# nanoid@3.3.16 (transitivo via next > postcss) tem um loop infinito
# possível em geradores customizados com size=0 (CWE-835). Patch em
# >=3.3.17. Force o resolvido em todo o workspace, não só a raiz.
overrides:
  # Faixa fechada em <4: nanoid 4+ é ESM-only e mudou padrões de export —
  # um override solto (">=3.3.17") pulou direto pra 6.0.1 e é risco real de
  # quebrar o build do Next/postcss por uma dependência transitiva que
  # ninguém nesse projeto pediu para atualizar. >=3.3.17 <4 pega só o patch
  # que corrige a CVE, sem mudar de major.
  nanoid: '>=3.3.17 <4'
strictPeerDependencies: true
verifyDepsBeforeRun: false
